<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELF OTC OTC</title>
    <!-- Подключаем официальный скрипт Telegram Mini Apps -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-background-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        .tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: var(--tg-theme-secondary-background-color, #212d3b);
            border-radius: 10px;
            padding: 5px;
        }
        .tab-btn {
            background: none;
            border: none;
            color: var(--tg-theme-hint-color, #708499);
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 50%;
            border-radius: 8px;
        }
        .tab-btn.active {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        .page { display: none; }
        .page.active { display: block; }
        .card {
            background: var(--tg-theme-secondary-background-color, #212d3b);
            border-radius: 15px;
            padding: 20px;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: left;
        }
        h1 { color: #31b6ff; margin-bottom: 5px; font-size: 24px; }
        #username-display { font-size: 14px; margin-bottom: 20px; color: var(--tg-theme-hint-color, #708499); text-align: center; }
        .balance-item {
            font-size: 18px;
            margin: 12px 0;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
            color: var(--tg-theme-hint-color, #708499);
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--tg-theme-background-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            font-size: 16px;
            box-sizing: border-box;
        }
        textarea { resize: vertical; height: 80px; }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <h1>ELF OTC</h1>
    <div id="username-display">Загрузка профиля...</div>

    <!-- Переключатель вкладок -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('wallet-page', this)">💼 Кошелек</button>
        <button class="tab-btn" onclick="switchTab('deal-page', this)">📄 Создать сделку</button>
    </div>

    <!-- ВКЛАДКА 1: КОШЕЛЕК -->
    <div id="wallet-page" class="page active">
        <div class="card">
            <h3 style="margin-top:0; color:#31b6ff;">📊 Баланс карт</h3>
            <div class="balance-item"><span>🇷🇺 Рубли:</span> <strong>0.00 RUB</strong></div>
            <div class="balance-item"><span>🇧🇾 Буни:</span> <strong>0.00 BYN</strong></div>
            <div class="balance-item"><span>🇰🇿 Тенге:</span> <strong>0.00 KZT</strong></div>
            <div class="balance-item"><span>🇺🇦 Гривны:</span> <strong>0.00 UAH</strong></div>
        </div>
    </div>

    <!-- ВКЛАДКА 2: СОЗДАНИЕ СДЕЛКИ -->
    <div id="deal-page" class="page">
        <div class="card">
            <h3 style="margin-top:0; color:#31b6ff;">💼 Параметры новой сделки</h3>
            
            <div class="form-group">
                <label>Валюта сделки</label>
                <select id="deal-currency">
                    <option value="RUB">🇷🇺 Рубли (RUB)</option>
                    <option value="BYN">🇧🇾 Буни (BYN)</option>
                    <option value="KZT">🇰🇿 Тенге (KZT)</option>
                    <option value="UAH">🇺🇦 Гривны (UAH)</option>
                    <option value="TON">💎 Криптовалюта (TON)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Сумма сделки</label>
                <input type="number" id="deal-amount" placeholder="Например: 500" min="1">
            </div>

            <div class="form-group">
                <label>Описание товара или услуги</label>
                <textarea id="deal-desc" placeholder="Укажите, что вы продаете в этой сделке..."></textarea>
            </div>

            <button class="btn" onclick="submitDeal()">✨ Создать сделку</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('username-display').innerText = `Профиль: ${user.first_name} (ID: ${user.id})`;
        }

        // Переключение между Кошельком и Сделками
        function switchTab(pageId, button) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => button.classList.remove('active'));
            
            document.getElementById(pageId).classList.add('active');
            
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
        }

        // Сбор данных формы и отправка боту
        function submitDeal() {
            const currency = document.getElementById('deal-currency').value;
            const amount = document.getElementById('deal-amount').value;
            const desc = document.getElementById('deal-desc').value.trim();

            if (!amount || amount <= 0) {
                alert("❌ Пожалуйста, введите корректную сумму сделки!");
                return;
            }
            if (!desc) {
                alert("❌ Пожалуйста, заполните описание сделки!");
                return;
            }

            // Формируем структурированный пакет данных для бота
            const dealData = {
                action: "create_deal_from_webapp",
                currency: currency,
                amount: parseFloat(amount),
                description: desc
            };

            // Метод Telegram отправляет этот текст обратно боту в чат и закрывает Mini App
            tg.sendData(JSON.stringify(dealData));
        }
    </script>
</body>
</html>
